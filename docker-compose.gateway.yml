# ============================================================================
# Docker Compose - API Gateway NGINX (Actividad A-12)
# Proyecto: Feria Digital Sigchos
# Propósito: Levantar un contenedor ligero (~20 MB RAM, límite 64 MB) que
#            unifica el punto de entrada HTTP hacia los 4 microservicios
#            (auth-service:8084, msvc-producto:8081, msvc-inventario:8082, msvc-ventas:8083)
# Uso:
#   docker compose -f docker-compose.gateway.yml up -d
#   (Si el puerto 8080 está ocupado en Windows local por VMware vmnat.exe,
#    ejecutar con GATEWAY_PORT=8090 en .env o variable de entorno)
# ============================================================================

services:
  api-gateway:
    image: nginx:1.27-alpine
    container_name: gateway-feria-digital
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/snippets:/etc/nginx/snippets:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          memory: 64M
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

