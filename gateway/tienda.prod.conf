# ============================================================================
# Plantilla de Nginx para Produccion: /etc/nginx/conf.d/tienda.conf (T09)
# Servidor: tienda.gadmsigchos.gob.ec (AlmaLinux 10.1, systemd nativo, sin Docker)
# ============================================================================

# Rate limiting perimetral por IP cliente
limit_req_zone $binary_remote_addr zone=prod_api_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=prod_api_auth:10m rate=5r/s;

# Origen CORS permitido en produccion (incluye puerto :444)
map $http_origin $prod_cors_origin {
    default "https://tienda.gadmsigchos.gob.ec:444";
    "~^https?://([a-zA-Z0-9-]+\.)?gadmsigchos\.gob\.ec(:[0-9]+)?$" $http_origin;
}

upstream prod_frontend {
    server 127.0.0.1:3000 max_fails=0;
    keepalive 16;
}

upstream prod_auth_service {
    server 127.0.0.1:8084 max_fails=0;
    keepalive 16;
}

upstream prod_producto_service {
    server 127.0.0.1:8081 max_fails=0;
    keepalive 16;
}

upstream prod_inventario_service {
    server 127.0.0.1:8082 max_fails=0;
    keepalive 16;
}

upstream prod_ventas_service {
    server 127.0.0.1:8083 max_fails=0;
    keepalive 16;
}

# ============================================================================
# 1. HTTP :80 -> Renovacion Certbot ACME y redireccion a HTTPS :444
# ============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name tienda.gadmsigchos.gob.ec;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host:444$request_uri;
    }
}

# ============================================================================
# 2. HTTPS :444 -> API Gateway Unificado + Frontend Next.js
# ============================================================================
server {
    listen 444 ssl;
    listen [::]:444 ssl;
    http2 on;
    server_name tienda.gadmsigchos.gob.ec;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/tienda.gadmsigchos.gob.ec/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tienda.gadmsigchos.gob.ec/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;
    limit_req_status 429;

    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Cabeceras HTTP de seguridad globales
    add_header 'Strict-Transport-Security' 'max-age=31536000; includeSubDomains' always;
    add_header 'X-Content-Type-Options' 'nosniff' always;
    add_header 'X-Frame-Options' 'SAMEORIGIN' always;
    add_header 'Referrer-Policy' 'strict-origin-when-cross-origin' always;
    add_header 'Permissions-Policy' 'geolocation=(), microphone=(), camera=()' always;

    error_page 413 = @prod_error_413;
    error_page 429 = @prod_error_429;
    error_page 502 = @prod_error_502;
    error_page 503 = @prod_error_503;
    error_page 504 = @prod_error_504;

    # Salud del Gateway
    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"api-gateway","engine":"nginx"}';
    }

    location = /api/health {
        default_type application/json;
        return 200 '{"status":"UP","service":"api-gateway","engine":"nginx"}';
    }

    # Bloqueos perimetrales explicitos
    location ~ ^/api/productos/[^/]+/sincronizar-stock$ {
        default_type application/json;
        return 403 '{"code":"FORBIDDEN","message":"Ruta de uso interno no accesible desde el exterior","status":403}';
    }

    location ~ ^/actuator(/.*)?$ {
        default_type application/json;
        return 403 '{"code":"FORBIDDEN","message":"Endpoint administrativo interno bloqueado en el Gateway","status":403}';
    }

    location ~ ^/(swagger-ui(\.html)?|api-docs|v3/api-docs)(/.*)?$ {
        default_type application/json;
        return 403 '{"code":"FORBIDDEN","message":"Documentacion interna de API bloqueada en el Gateway","status":403}';
    }

    location ~ ^/(camunda|engine-rest)(/.*)?$ {
        default_type application/json;
        return 403 '{"code":"FORBIDDEN","message":"Consola de procesos internos bloqueada en el Gateway","status":403}';
    }

    location ^~ /api/ventas/internal {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"La ruta solicitada no existe en el API Gateway","status":404}';
    }

    # --- auth-service (127.0.0.1:8084) ---
    location /api/auth {
        limit_req zone=prod_api_auth burst=15 nodelay;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        add_header 'Access-Control-Allow-Origin' $prod_cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Vary' 'Origin' always;
        add_header 'Strict-Transport-Security' 'max-age=31536000; includeSubDomains' always;
        add_header 'X-Content-Type-Options' 'nosniff' always;
        add_header 'X-Frame-Options' 'SAMEORIGIN' always;
        add_header 'Referrer-Policy' 'strict-origin-when-cross-origin' always;
        add_header 'Permissions-Policy' 'geolocation=(), microphone=(), camera=()' always;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://prod_auth_service;
    }

    location /api/usuarios {
        limit_req zone=prod_api_general burst=40 nodelay;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://prod_auth_service;
    }

    location /api/emprendedor/configuracion-pagos {
        limit_req zone=prod_api_general burst=40 nodelay;
        client_max_body_size 10M;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://prod_auth_service;
    }

    location ~ ^/api/emprendedor/deuna-qr/([0-9]+)$ {
        limit_req zone=prod_api_general burst=40 nodelay;
        rewrite ^/api/emprendedor/deuna-qr/([0-9]+)$ /api/emprendedor/configuracion-pagos/deuna-qr/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://prod_auth_service;
    }

    location /uploads/qr-deuna {
        limit_req zone=prod_api_general burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://prod_auth_service;
    }

    # --- msvc-producto (127.0.0.1:8081) ---
    location ~ ^/api/(productos|categorias|empresas)(/.*)?$ {
        limit_req zone=prod_api_general burst=40 nodelay;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://prod_producto_service;
    }

    # --- msvc-inventario (127.0.0.1:8082) ---
    location ~ ^/api/(inventarios|movimientos)(/.*)?$ {
        limit_req zone=prod_api_general burst=40 nodelay;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://prod_inventario_service;
    }

    # --- msvc-ventas (127.0.0.1:8083) ---
    location ~ ^/api/(ventas|clientes|pagos|seguimiento-logistica|bpm/ventas)(/.*)?$ {
        limit_req zone=prod_api_general burst=40 nodelay;
        proxy_read_timeout 60s;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
        proxy_hide_header Access-Control-Max-Age;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://prod_ventas_service;
    }

    # --- Frontend Next.js (127.0.0.1:3000) ---
    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_pass http://prod_frontend;
    }

    location @prod_error_413 {
        default_type application/json;
        return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"El tamano de la solicitud supera el limite permitido (10 MB)","status":413}';
    }

    location @prod_error_429 {
        default_type application/json;
        return 429 '{"code":"TOO_MANY_REQUESTS","message":"Demasiadas solicitudes. Intente nuevamente en unos segundos","status":429}';
    }

    location @prod_error_502 {
        default_type application/json;
        return 502 '{"code":"SERVICE_UNAVAILABLE","message":"El servicio solicitado no se encuentra disponible temporalmente (Bad Gateway)","status":502}';
    }

    location @prod_error_503 {
        default_type application/json;
        return 503 '{"code":"SERVICE_UNAVAILABLE","message":"Servicio temporalmente no disponible","status":503}';
    }

    location @prod_error_504 {
        default_type application/json;
        return 504 '{"code":"GATEWAY_TIMEOUT","message":"El servicio tardo demasiado en responder (Gateway Timeout)","status":504}';
    }
}

# ============================================================================
# 3. Gateway Interno Loopback (127.0.0.1:8080) para SSR/rewrites de Next.js
#    Solo accesible localmente (no expuesto hacia Internet).
# ============================================================================
server {
    listen 127.0.0.1:8080;
    server_name localhost;
    server_tokens off;
    client_max_body_size 10M;

    location = /health {
        default_type application/json;
        return 200 '{"status":"UP","service":"api-gateway-internal","engine":"nginx"}';
    }

    location ~ ^/(actuator|swagger-ui(\.html)?|api-docs|v3/api-docs|camunda|engine-rest)(/.*)?$ {
        default_type application/json;
        return 403 '{"code":"FORBIDDEN","message":"Endpoint interno bloqueado","status":403}';
    }

    location ~ ^/(api/(auth|usuarios|emprendedor/configuracion-pagos)|uploads/qr-deuna)(/.*)?$ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://prod_auth_service;
    }

    location ~ ^/api/emprendedor/deuna-qr/([0-9]+)$ {
        rewrite ^/api/emprendedor/deuna-qr/([0-9]+)$ /api/emprendedor/configuracion-pagos/deuna-qr/$1 break;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_pass http://prod_auth_service;
    }

    location ~ ^/api/(productos|categorias|empresas)(/.*)?$ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://prod_producto_service;
    }

    location ~ ^/api/(inventarios|movimientos)(/.*)?$ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://prod_inventario_service;
    }

    location ~ ^/api/(ventas|clientes|pagos|seguimiento-logistica|bpm/ventas)(/.*)?$ {
        proxy_read_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Authorization $http_authorization;
        proxy_pass http://prod_ventas_service;
    }

    location / {
        default_type application/json;
        return 404 '{"code":"NOT_FOUND","message":"Ruta no encontrada en el gateway interno","status":404}';
    }
}
