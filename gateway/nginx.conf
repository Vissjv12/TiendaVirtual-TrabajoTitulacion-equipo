# ============================================================================
# API Gateway Centralizado - Feria Digital Sigchos (Actividad A-12)
# Implementación basada en el diseño oficial A-11:
#   - Enrutamiento unificado hacia los 4 microservicios (8081, 8082, 8083, 8084)
#   - Política CORS centralizada y deduplicada (O-13)
#   - Bloqueo perimetral de rutas internas Feign (/sincronizar-stock)
#   - Respuestas de error perimetrales en formato JSON uniforme
#   - Huella de memoria ultraligera (~20 MB RAM, mitiga R-01)
# ============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/json;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Límite global de carga (10 MB para soportar subida de QR Deuna de hasta 5 MB)
    client_max_body_size 10M;

    # Timeouts por defecto hacia microservicios
    proxy_connect_timeout 5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Resolución dinámica de origen permitido para CORS con credenciales
    map $http_origin $cors_origin {
        default "http://localhost:3000";
        "~^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$" $http_origin;
        "~^https?://([a-zA-Z0-9-]+\.)?gadmsigchos\.gob\.ec$" $http_origin;
    }

    # ========================================================================
    # Definición de Upstreams (Microservicios Backend)
    # host.docker.internal permite alcanzar los servicios tanto en Windows/Mac
    # como en Linux (mediante extra_hosts: host-gateway en Docker Compose).
    # ========================================================================
    upstream auth_service {
        server host.docker.internal:8084 max_fails=0;
        keepalive 16;
    }

    upstream producto_service {
        server host.docker.internal:8081 max_fails=0;
        keepalive 16;
    }

    upstream inventario_service {
        server host.docker.internal:8082 max_fails=0;
        keepalive 16;
    }

    upstream ventas_service {
        server host.docker.internal:8083 max_fails=0;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;

        # Páginas de error perimetrales en formato JSON
        error_page 413 = @error_413;
        error_page 429 = @error_429;
        error_page 502 = @error_502;
        error_page 503 = @error_503;
        error_page 504 = @error_504;

        # ====================================================================
        # 1. Salud del API Gateway
        # ====================================================================
        location = /health {
            include /etc/nginx/snippets/cors-headers.conf;
            default_type application/json;
            return 200 '{"status":"UP","service":"api-gateway","engine":"nginx"}';
        }

        location = /api/health {
            include /etc/nginx/snippets/cors-headers.conf;
            default_type application/json;
            return 200 '{"status":"UP","service":"api-gateway","engine":"nginx"}';
        }

        # ====================================================================
        # 2. Bloqueo Perimetral de Rutas Internas (Seguridad Este-Oeste)
        # ====================================================================
        # PUT /api/productos/{id}/sincronizar-stock es exclusivo para Feign interno
        location ~ ^/api/productos/[^/]+/sincronizar-stock$ {
            include /etc/nginx/snippets/cors-headers.conf;
            default_type application/json;
            return 403 '{"code":"FORBIDDEN","message":"Ruta de uso interno no accesible desde el exterior","status":403}';
        }

        # Bloqueo de endpoints de diagnóstico interno
        location ~ ^/actuator(/.*)?$ {
            include /etc/nginx/snippets/cors-headers.conf;
            default_type application/json;
            return 403 '{"code":"FORBIDDEN","message":"Endpoint administrativo interno bloqueado en el Gateway","status":403}';
        }

        # ====================================================================
        # 3. Rutas hacia auth-service (demo :8084)
        # ====================================================================
        location /api/auth {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://auth_service;
        }

        location /api/usuarios {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://auth_service;
        }

        location /api/emprendedor/configuracion-pagos {
            include /etc/nginx/snippets/proxy-params.conf;
            client_max_body_size 10M;
            proxy_pass http://auth_service;
        }

        # Alias de compatibilidad para Deuna QR (mitiga O-06)
        location ~ ^/api/emprendedor/deuna-qr/([0-9]+)$ {
            include /etc/nginx/snippets/proxy-params.conf;
            rewrite ^/api/emprendedor/deuna-qr/([0-9]+)$ /api/emprendedor/configuracion-pagos/deuna-qr/$1 break;
            proxy_pass http://auth_service;
        }

        location = /api/emprendedor/deuna-qr {
            include /etc/nginx/snippets/proxy-params.conf;
            rewrite ^/api/emprendedor/deuna-qr$ /api/emprendedor/configuracion-pagos/deuna-qr/1 break;
            proxy_pass http://auth_service;
        }

        location /uploads/qr-deuna {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://auth_service;
        }

        # ====================================================================
        # 4. Rutas hacia msvc-producto (:8081)
        # ====================================================================
        location /api/productos {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://producto_service;
        }

        location /api/categorias {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://producto_service;
        }

        location /api/empresas {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://producto_service;
        }

        # ====================================================================
        # 5. Rutas hacia msvc-inventario (:8082)
        # ====================================================================
        location /api/inventarios {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://inventario_service;
        }

        location /api/movimientos {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://inventario_service;
        }

        # ====================================================================
        # 6. Rutas hacia msvc-ventas (:8083)
        # ====================================================================
        location /api/ventas {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_read_timeout 60s;
            proxy_pass http://ventas_service;
        }

        location /api/clientes {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://ventas_service;
        }

        location /api/pagos {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_read_timeout 60s;
            proxy_pass http://ventas_service;
        }

        location /api/seguimiento-logistica {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://ventas_service;
        }

        location /api/stripe {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_read_timeout 60s;
            proxy_pass http://ventas_service;
        }

        location /api/bpm/ventas {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_read_timeout 60s;
            proxy_pass http://ventas_service;
        }

        # ====================================================================
        # 7. Ruta por defecto (404 JSON para rutas inexistentes en el Gateway)
        # ====================================================================
        location / {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Credentials' 'true' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, Cache-Control, Stripe-Signature' always;
                add_header 'Access-Control-Max-Age' 3600 always;
                add_header 'Vary' 'Origin' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }
            include /etc/nginx/snippets/cors-headers.conf;
            default_type application/json;
            return 404 '{"code":"NOT_FOUND","message":"La ruta solicitada no existe en el API Gateway","status":404}';
        }

        # ====================================================================
        # 8. Manejadores de Errores Perimetrales en Formato JSON
        # ====================================================================
        location @error_413 {
            include /etc/nginx/snippets/cors-headers.conf;
            default_type application/json;
            return 413 '{"code":"PAYLOAD_TOO_LARGE","message":"El tamano de la solicitud supera el limite permitido (10 MB)","status":413}';
        }

        location @error_429 {
            include /etc/nginx/snippets/cors-headers.conf;
            default_type application/json;
            return 429 '{"code":"TOO_MANY_REQUESTS","message":"Demasiadas solicitudes. Intente nuevamente en unos segundos","status":429}';
        }

        location @error_502 {
            include /etc/nginx/snippets/cors-headers.conf;
            default_type application/json;
            return 502 '{"code":"SERVICE_UNAVAILABLE","message":"El servicio solicitado no se encuentra disponible temporalmente (Bad Gateway)","status":502}';
        }

        location @error_503 {
            include /etc/nginx/snippets/cors-headers.conf;
            default_type application/json;
            return 503 '{"code":"SERVICE_UNAVAILABLE","message":"Servicio temporalmente no disponible","status":503}';
        }

        location @error_504 {
            include /etc/nginx/snippets/cors-headers.conf;
            default_type application/json;
            return 504 '{"code":"GATEWAY_TIMEOUT","message":"El servicio tardo demasiado en responder (Gateway Timeout)","status":504}';
        }
    }
}

