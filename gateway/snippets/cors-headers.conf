# ============================================================================
# Cabeceras CORS centralizadas del API Gateway (Actividad A-12 / O-13)
# Se incluyen con 'always' para que también estén presentes en errores 4xx/5xx.
# ============================================================================
add_header 'Access-Control-Allow-Origin' $cors_origin always;
add_header 'Access-Control-Allow-Credentials' 'true' always;
add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, Cache-Control, Stripe-Signature' always;
add_header 'Access-Control-Expose-Headers' 'Authorization, Content-Type, Content-Disposition' always;
add_header 'Vary' 'Origin' always;

