# ============================================================================
# Parámetros de Proxy Inverso y CORS Centralizado (Actividad A-12)
# Incluido en todos los bloques location que enrutan hacia microservicios.
# ============================================================================

# 1. Resolución directa de solicitudes Preflight (OPTIONS) en el Gateway
if ($request_method = 'OPTIONS') {
    add_header 'Access-Control-Allow-Origin' $cors_origin always;
    add_header 'Access-Control-Allow-Credentials' 'true' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS, HEAD' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, Cache-Control, Stripe-Signature' always;
    add_header 'Access-Control-Max-Age' 3600 always;
    add_header 'Vary' 'Origin' always;
    add_header 'Content-Type' 'text/plain; charset=utf-8' always;
    add_header 'Content-Length' 0 always;
    return 204;
}

# 2. Ocultar cabeceras CORS provenientes de los microservicios (mitiga O-13: cabeceras duplicadas)
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Allow-Credentials;
proxy_hide_header Access-Control-Allow-Methods;
proxy_hide_header Access-Control-Allow-Headers;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Max-Age;

# 3. Inyectar cabeceras CORS centralizadas del Gateway (incluyendo respuestas 4xx/5xx)
include /etc/nginx/snippets/cors-headers.conf;

# 4. Propagación de cabeceras HTTP e identidad (JWT Bearer, Stripe, IP cliente)
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header Authorization $http_authorization;
proxy_set_header Stripe-Signature $http_stripe_signature;

# 5. No interceptar errores de aplicación (400, 401, 403, 404, 409, 500 de los microservicios pasan intactos)
proxy_intercept_errors off;

