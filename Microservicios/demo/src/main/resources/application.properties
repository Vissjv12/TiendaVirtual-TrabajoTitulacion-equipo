# Configuracion de la aplicacion
spring.application.name=login
server.port=8084

# Configuracion de la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/auth_service?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
spring.datasource.username=${MYSQL_USER:admin}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuracion de Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# Configuracion de Swagger OpenAPI (deshabilitado por defecto fuera de perfil local)
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Aumentar timeouts y pool de conexiones
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
server.tomcat.max-connections=200
server.tomcat.connection-timeout=30000

# Logs menos verbosos
logging.level.org.springframework.web=WARN
logging.level.root=WARN

# Clave secreta fija para JWT (permite que los tokens sobrevivan reinicios del servidor)
jwt.secret=${JWT_SECRET}

# Google OAuth (login con Google) - definir GOOGLE_CLIENT_ID como variable de entorno
# Debe ser el mismo Client ID configurado en el frontend (NEXT_PUBLIC_GOOGLE_CLIENT_ID)
google.client-id=${GOOGLE_CLIENT_ID:}

# Envio de correos (recuperacion de contrasena). En dev cae a un sandbox de Mailtrap;
# en produccion definir MAIL_HOST/MAIL_PORT/MAIL_USERNAME/MAIL_PASSWORD reales.
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000

app.mail.from=${MAIL_FROM:noreply@ecommerce-sigchos.com}
app.mail.from-name=${MAIL_FROM_NAME:Sigchos E-commerce}

# Payphone (hallazgo C-02): el token de cada comercio se guarda en BD y solo lo usa este servicio.
# El navegador nunca recibe el token; responseUrl/cancellationUrl las fija el servidor.
payphone.api.base-url=${PAYPHONE_API_BASE_URL:https://pay.payphonetodoesposible.com}
payphone.response-url=${PAYPHONE_RESPONSE_URL:http://localhost:3000/checkout/payphone-confirmacion}
payphone.cancellation-url=${PAYPHONE_CANCELLATION_URL:http://localhost:3000/checkout}
# Timeouts del cliente HTTP saliente (RestClient)
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=20s
# Cifrado en reposo del token de Payphone: Base64 de 32 bytes (AES-256-GCM). Solo en el servidor.
# Sin esta clave no se pueden guardar ni leer tokens cifrados (falla cerrado).
payphone.token.encryption-key=${PAYPHONE_TOKEN_ENC_KEY:}
# msvc-ventas (canal interno de pagos de pasarela, NO por el Gateway) (A-03/A-04)
app.msvc-ventas.url=${MSVC_VENTAS_URL:http://localhost:8083}
