# Puerto del microservicio
server.port=8083

# Nombre del microservicio
spring.application.name=msvc-ventas

# Configuracion de base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/ventas?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
spring.datasource.username=${MYSQL_USER:admin}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Configuracion de Eureka Client
# TEMPORALMENTE DESHABILITADO - Problema de compatibilidad con Spring Cloud 2024.0.1
# Ver: https://github.com/spring-cloud/spring-cloud-netflix/issues/4484
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
# Una vez resuelto, descomentar:
#eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
#eureka.instance.instance-id=${spring.application.name}:${random.value}
#eureka.instance.prefer-ip-address=true

# Configuracion para los microservicios
app.msvc-inventario.url=http://localhost:8082
app.msvc-producto.url=http://localhost:8081
app.msvc-auth-service.url=http://localhost:8084

# Timeouts explicitos para evitar mantener transacciones abiertas ante servicios lentos
spring.cloud.openfeign.client.config.default.connectTimeout=3000
spring.cloud.openfeign.client.config.default.readTimeout=5000

# Configuracion de Stripe: definir fuera del repositorio
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Configuracion de Facturas PDF
factura.directorio=facturas

# Configuracion de Circuit Breaker para Feign
feign.circuitbreaker.enabled=true

# Configuracion de Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.csrf.enabled=true
springdoc.default-produces-media-type=application/json
springdoc.default-consumes-media-type=application/json
springdoc.writer-with-default-pretty-printer=true

# Aumentar timeouts y pool de conexiones
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.leak-detection-threshold=60000
server.tomcat.max-connections=200
server.tomcat.connection-timeout=30000

# Logs menos verbosos
logging.level.org.springframework.web=WARN
logging.level.root=WARN

# Configuracion de Camunda BPM
camunda.bpm.admin-user.id=${CAMUNDA_BPM_ADMIN_USER_ID:admin}
camunda.bpm.admin-user.password=${CAMUNDA_BPM_ADMIN_USER_PASSWORD}
camunda.bpm.admin-user.firstName=Admin
camunda.bpm.admin-user.lastName=User
camunda.bpm.admin-user.email=admin@siachos.com
camunda.bpm.filter.create=All tasks
camunda.bpm.auto-deployment-enabled=true
camunda.bpm.deployment-resource-pattern=classpath*:**/*.bpmn
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=full
camunda.bpm.id-generator=strong
camunda.bpm.job-execution.enabled=true
camunda.bpm.job-execution.deployment-aware=true
