spring.application.name=msvc-producto

# Clave compartida con el servicio de autenticaciÃ³n para validar JWT.
# En producciÃ³n debe definirse JWT_SECRET fuera del repositorio.
jwt.secret=${JWT_SECRET}

# Puerto del servicio (distinto al del servicio de autenticacion)
server.port=8081

# Configuracion de la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/productos?useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
spring.datasource.username=${MYSQL_USER:admin}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Configuracion de Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# URL del microservicio de inventario
app.msvc-inventario.url=http://localhost:8082

# Estamos habilitando la integracion de Feign con el Circuit Breaker
feign.circuitbreaker.enabled=true

# Configuracion de Swagger OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Configuracion del pool de conexiones Hikari (aumentado para JMeter)
spring.datasource.hikari.maximum-pool-size=100
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPool-1

# Aumentar timeouts y pool de conexiones
server.tomcat.max-connections=200
server.tomcat.connection-timeout=30000

# Logs menos verbosos
logging.level.org.springframework.web=WARN
logging.level.root=WARN

# Redis opcional para el piloto de catálogo. No activar fuera del perfil local aprobado.
cache.redis.enabled=${CACHE_REDIS_ENABLED:false}
cache.redis.productos.listado.enabled=${CACHE_REDIS_PRODUCTOS_LISTADO_ENABLED:false}
cache.redis.ttl-productos=${CACHE_REDIS_TTL_PRODUCTOS:PT5M}
cache.redis.categorias.enabled=${CACHE_REDIS_CATEGORIAS_ENABLED:false}
cache.redis.ttl-categorias=${CACHE_REDIS_TTL_CATEGORIAS:PT15M}
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
