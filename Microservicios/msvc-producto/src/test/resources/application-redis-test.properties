# Perfil exclusivo del piloto local: usa únicamente los puertos y credenciales de prueba.
cache.redis.enabled=true
cache.redis.productos.listado.enabled=true
cache.redis.ttl-productos=PT5M
cache.redis.categorias.enabled=true
cache.redis.ttl-categorias=PT15M
spring.data.redis.host=${TEST_REDIS_HOST:127.0.0.1}
spring.data.redis.port=${TEST_REDIS_PORT:6380}
spring.data.redis.username=${TEST_REDIS_USERNAME:}
spring.data.redis.password=${TEST_REDIS_PASSWORD:}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}

spring.datasource.url=jdbc:mysql://127.0.0.1:${TEST_MYSQL_PORT:3307}/productos?useSSL=false&serverTimezone=America/Guayaquil&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8
spring.datasource.username=${TEST_MYSQL_USER}
spring.datasource.password=${TEST_MYSQL_PASSWORD}
jwt.secret=${TEST_JWT_SECRET}
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
